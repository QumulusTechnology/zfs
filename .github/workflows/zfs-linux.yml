name: Builds
on:
  - push

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  RELEASE_NUMBER: 1

concurrency:
  group: '${{ github.workflow }} @ ${{ github.repository }} @ ${{ github.base_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os:
          - 24.04
    runs-on:
      group: prod
    container:
      image: ubuntu:${{ matrix.os }}

    steps:

      - name: install latest git
        run: |
          apt update
          apt-get install -yq software-properties-common
          apt-add-repository ppa:git-core/ppa
          apt-get install -yq git jq

      - uses: QumulusTechnology/vault-setup-action@v2
        with:
          aws_account_data: ${{ secrets.AWS_ACCOUNT_DATA }}
          vault_addr: ${{ secrets.VAULT_ADDR }}
          platform: qcp
          secrets: |
            secret/data/qcp/global/automation-user-gpg-key private-key | GPG_PRIVATE_KEY ;
            secret/data/qcp/global/qumulus-automation-user-docker-io-credentials token | REPO_PASSWORD ;
            secret/data/qcp/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/kubernetes/eu-west1/nexusrepo username | NEXUS_USERNAME ;
            secret/data/qcp/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/kubernetes/eu-west1/nexusrepo password | NEXUS_PASSWORD ;
            secret/data/qcp/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/kubernetes/eu-west1/nexusrepo url | NEXUS_URL ;

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get upgrade -y
          apt-get -yq install \
            debhelper \
            debsigs \
            devscripts \
            dh-autoreconf \
            dh-python \
            dkms \
            dpkg-dev \
            libaio-dev \
            libblkid-dev \
            libcurl4-openssl-dev \
            libelf-dev \
            libpam0g-dev \
            libssl-dev \
            libtool \
            libudev-dev \
            lsb-release \
            po-debconf \
            python3-all-dev \
            python3-cffi \
            python3-setuptools \
            python3-sphinx \
            uuid-dev \
            zlib1g-dev \
            libtirpc-dev \
            gnupg2

          apt-get -yq install dh-dkms || true

      - name: Setup GPG
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --import
          echo "default-cache-ttl 3600" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 3600" >> ~/.gnupg/gpg-agent.conf
          gpg --list-secret-keys

      - name: Build ZFS
        env:
          PKGOS: ubuntu-${{ matrix.os }}
          PKGARCH: amd64
        run: |

            [ "${PKGOS}" = "ubuntu-22.04" ] && CODENAME=jammy
            [ "${PKGOS}" = "ubuntu-24.04" ] && CODENAME=noble

            echo "$CODENAME=$CODENAME" >> "$GITHUB_ENV"

            ./autogen.sh
            ./configure

            ZFS_VERSION=$(cat META | grep ^Version: | awk '{print $2}')

            cd contrib
            dch -D ${CODENAME} -M -b -m "Qumulus Automated ZFS build" -v ${ZFS_VERSION}-${RELEASE_NUMBER}
            cd ..

            make native-deb-utils

      - name: Sign packages
        run: |
          # Get the key ID in short format
          KEY_ID=$(gpg --list-secret-keys --keyid-format SHORT | grep sec | awk '{print $2}' | cut -d'/' -f2)

          debsigs --sign=origin -k $KEY_ID ../*.deb

      - name: upload packages to Nexus
        env:
            PKGOS: ubuntu-${{ matrix.os }}
            PKGARCH: amd64
        shell: bash
        run: |
          # Set CODENAME based on Ubuntu version
          if [ "${PKGOS}" = "ubuntu-22.04" ]; then
            CODENAME="jammy"
          elif [ "${PKGOS}" = "ubuntu-24.04" ]; then
            CODENAME="noble"
          else
            echo "Unsupported Ubuntu version: ${PKGOS}"
            exit 1
          fi

          # Set repository based on branch
          if [ "${BRANCH}" == "main" ]; then
            NEXUS_REPO="qcp-zfs"
          else
            NEXUS_REPO="qcp-zfs-dev"
          fi

          echo "Uploading packages for ${CODENAME} to ${NEXUS_REPO}"

          for file in ../*.deb
          do
            # Extract just the filename without the path
            filename=$(basename "${file}")

            echo "Uploading package: ${filename}"

            # Use the direct repository URL without the pool structure
            curl -v -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
                  -H "Content-Type: multipart/form-data" \
                  --data-binary "@${file}" \
                  "https://${NEXUS_URL}/repository/${NEXUS_REPO}/"
          done
