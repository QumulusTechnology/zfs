name: Builds
on:
  - push

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  RELEASE_NUMBER: 1

concurrency:
  group: '${{ github.workflow }} @ ${{ github.repository }} @ ${{ github.base_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os:
          - 24.04
    runs-on:
      group: prod
    container:
      image: ubuntu:${{ matrix.os }}

    steps:

      - name: install latest git
        run: |
          apt update
          apt-get install -yq software-properties-common
          apt-add-repository ppa:git-core/ppa
          apt-get install -yq git jq

      - uses: QumulusTechnology/vault-setup-action@v2
        with:
          aws_account_data: ${{ secrets.AWS_ACCOUNT_DATA }}
          vault_addr: ${{ secrets.VAULT_ADDR }}
          platform: qcp
          secrets: |
            secret/data/qcp/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/kubernetes/eu-west1/nexusrepo username | NEXUS_USERNAME ;
            secret/data/qcp/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/kubernetes/eu-west1/nexusrepo password | NEXUS_PASSWORD ;
            secret/data/qcp/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/kubernetes/eu-west1/nexusrepo url | NEXUS_URL ;

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get upgrade -y
          apt-get -yq install \
            debhelper \
            debsigs \
            devscripts \
            dh-autoreconf \
            dh-python \
            dkms \
            dpkg-dev \
            libaio-dev \
            libblkid-dev \
            libcurl4-openssl-dev \
            libelf-dev \
            libpam0g-dev \
            libssl-dev \
            libtool \
            libudev-dev \
            lsb-release \
            po-debconf \
            python3-all-dev \
            python3-cffi \
            python3-setuptools \
            python3-sphinx \
            uuid-dev \
            zlib1g-dev \
            libtirpc-dev \
            gnupg2

          apt-get -yq install dh-dkms || true

      - name: Build ZFS
        env:
          PKGOS: ubuntu-${{ matrix.os }}
          PKGARCH: amd64
        run: |

            [ "${PKGOS}" = "ubuntu-22.04" ] && CODENAME=jammy
            [ "${PKGOS}" = "ubuntu-24.04" ] && CODENAME=noble

            echo "$CODENAME=$CODENAME" >> "$GITHUB_ENV"

            ./autogen.sh
            ./configure

            ZFS_VERSION=$(cat META | grep ^Version: | awk '{print $2}')

            cd contrib
            dch -D ${CODENAME} -M -b -m "Qumulus Automated ZFS build" -v ${ZFS_VERSION}-${RELEASE_NUMBER}
            cd ..

            make native-deb-utils


      - name: Upload packages to Nexus
        env:
          PKGOS: ubuntu-${{ matrix.os }}
          PKGARCH: amd64
        run: |
          # Set distribution name based on OS version
          [ "${PKGOS}" = "ubuntu-22.04" ] && DISTRIBUTION="ubuntu-jammy"
          [ "${PKGOS}" = "ubuntu-24.04" ] && DISTRIBUTION="ubuntu-noble"

          # Set repository based on branch using new naming convention
          if [ "${BRANCH}" = "main" ]; then
            NEXUS_REPO="qcp-zfs-${DISTRIBUTION}"
          else
            NEXUS_REPO="qcp-zfs-${BRANCH}-${DISTRIBUTION}"
          fi

          echo "Uploading packages for ${PKGOS} to ${NEXUS_REPO} (distribution: ${DISTRIBUTION})"

          # Function to delete existing package
          delete_existing_package() {
            local filename="$1"
            local package_name="${filename%_*}"  # Extract package name before version

            echo "Checking for existing package: ${package_name}"

            # Search for existing package using Nexus Search API
            SEARCH_RESPONSE=$(mktemp)
            SEARCH_CODE=$(curl -s -o "${SEARCH_RESPONSE}" -w "%{http_code}" \
                -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
                "${NEXUS_URL}/service/rest/v1/search?repository=${NEXUS_REPO}&name=${package_name}")

            if [ "${SEARCH_CODE}" = "200" ]; then
              # Check if any items were found
              ITEM_COUNT=$(grep -o '"items":\[' "${SEARCH_RESPONSE}" | wc -l)
              if [ "${ITEM_COUNT}" -gt 0 ]; then
                echo "Found existing package(s) for ${package_name}, attempting to delete..."

                # Extract component IDs and delete them
                grep -o '"id":"[^"]*"' "${SEARCH_RESPONSE}" | cut -d'"' -f4 | while read -r component_id; do
                  if [ -n "${component_id}" ]; then
                    echo "Deleting component ID: ${component_id}"
                    DELETE_CODE=$(curl -s -w "%{http_code}" -o /dev/null \
                        -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
                        -X DELETE \
                        "${NEXUS_URL}/service/rest/v1/components/${component_id}")

                    if [ "${DELETE_CODE}" = "204" ]; then
                      echo "✓ Successfully deleted existing component: ${component_id}"
                    else
                      echo "⚠ Failed to delete component ${component_id} (HTTP ${DELETE_CODE}), continuing..."
                    fi
                  fi
                done
              else
                echo "No existing packages found for ${package_name}"
              fi
            else
              echo "⚠ Could not search for existing packages (HTTP ${SEARCH_CODE}), continuing with upload..."
            fi

            rm -f "${SEARCH_RESPONSE}"
          }

          # Add variables to track success/failure
          UPLOAD_SUCCESS=true

          for file in ../*.deb; do
            # Skip if no files match the pattern
            if [ ! -f "${file}" ]; then
              echo "No .deb files found in parent directory"
              continue
            fi

            # Extract just the filename without the path
            filename=$(basename "${file}")
            filesize=$(stat -c%s "${file}")

            echo "Processing package: ${filename} (size: ${filesize} bytes)"

            # Delete existing package first
            delete_existing_package "${filename}"

            echo "Uploading package: ${filename}"

            # Use temp file for response and disable progress meter
            HTTP_RESPONSE=$(mktemp)
            HTTP_CODE=$(curl -s -S -o "${HTTP_RESPONSE}" -w "%{http_code}" \
                  -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
                  --fail-with-body \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary "@${file}" \
                  "${NEXUS_URL}/repository/${NEXUS_REPO}/")
            CURL_EXIT=$?

            # Check for curl errors and HTTP status
            if [ ${CURL_EXIT} -ne 0 ] || [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
              echo "ERROR: Failed to upload ${filename} - HTTP Status: ${HTTP_CODE}"
              echo "Error response:"
              cat "${HTTP_RESPONSE}" | head -10  # Show just the first 10 lines of error
              UPLOAD_SUCCESS=false
            else
              echo "✓ Successfully uploaded ${filename}"
            fi

            rm -f "${HTTP_RESPONSE}"
          done

          # Exit with error if any upload failed
          if [ "${UPLOAD_SUCCESS}" = "false" ]; then
            echo "❌ One or more package uploads failed. Job will be marked as failed."
            exit 1
          else
            echo "✅ All packages uploaded successfully."
          fi
